# Movie Finder — Codex project configuration
# Project-scoped config. Loaded only when repo is marked trusted.
# Mirrors .mcp.json (Claude Code) and .gemini/settings.json so all MCP servers are available in all tools.

# ---------------------------------------------------------------------------
# Model & behaviour
# ---------------------------------------------------------------------------
approval_policy = "on-request"
model_reasoning_effort = "high"

[features]
multi_agent = true      # stable — enables subagent collaboration
smart_approvals = false # experimental — enable when ready

# ---------------------------------------------------------------------------
# MCP servers
# All required env vars must exist in your shell (~/.zshrc).
# ---------------------------------------------------------------------------

[mcp_servers.github]
command = "/bin/sh"
args = ["-c", "GITHUB_PERSONAL_ACCESS_TOKEN=$(gh auth token) npx -y @modelcontextprotocol/server-github"]

[mcp_servers.qdrant-evaluator]
command = "uv"
args = ["run", "src/qdrant/main.py"]
cwd = "mcp/qdrant-explorer"
env_vars = [
  "OPENAI_API_KEY",
  "OPENAI_EMBEDDING_MODEL",
  "QDRANT_API_KEY_RO",
  "QDRANT_COLLECTION_NAME",
  "QDRANT_URL",
]

# postgres MCP takes DATABASE_URL as a positional CLI argument.
# Codex does not expand ${env:...} placeholders in args, so use a shell wrapper.
[mcp_servers.postgres]
command = "/bin/sh"
args = ["-lc", "exec npx -y @modelcontextprotocol/server-postgres \"$DATABASE_URL\""]
env_vars = ["DATABASE_URL"]

[mcp_servers.kaggle]
command = "uvx"
args = ["kaggle-mcp"]
env_vars = ["KAGGLE_API_TOKEN"]

[mcp_servers.azure]
command = "npx"
args = ["-y", "@azure/mcp@latest", "server", "start"]

[mcp_servers.jenkins-local]
command = "npx"
args = ["-y", "@kud/mcp-jenkins@latest"]
env_vars = ["MCP_JENKINS_URL", "MCP_JENKINS_USER", "MCP_JENKINS_API_TOKEN"]
