# =============================================================================
# movie-finder — Root orchestration GitHub Actions CI
#
# Mirrors the root Jenkinsfile 1:1. Both pipelines must remain in sync.
#
# Pipeline:
#   Build      — build and push backend + frontend images to ACR
#   Staging    — rolling update of staging Azure Container Apps (main/tags)
#   Production — rolling update of production Azure Container Apps (tags only,
#                requires manual approval via GitHub environment protection)
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   ACR_LOGIN_SERVER          Full ACR hostname, e.g. myacr.azurecr.io
#   ACR_USERNAME              Service principal App ID
#   ACR_PASSWORD              Service principal client secret
#   AZURE_SUBSCRIPTION_ID     Azure subscription ID
#   AZURE_TENANT_ID           Azure tenant ID
#   AZURE_SP_CLIENT_ID        Service principal App ID for Azure CLI
#   AZURE_SP_CLIENT_SECRET    Service principal client secret for Azure CLI
#   DB_ADMIN_USERNAME         PostgreSQL administrator username
#   DB_ADMIN_PASSWORD         PostgreSQL administrator password
#   APP_SECRET_KEY            Backend JWT signing key
#   Provider/vector secrets matching infrastructure/docs/provider-runtime-contract.md
#
# Required GitHub environments (Settings → Environments):
#   staging     — no protection rules required (auto-deploy on main)
#   production  — required reviewer protection rule for manual approval
# =============================================================================

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy_staging:
        type: boolean
        default: true
        description: Deploy to staging after a successful build.
      deploy_production:
        type: boolean
        default: false
        description: Deploy to production (requires environment approval).
      with_providers:
        type: choice
        default: default-cloud
        options:
          - default-cloud
          - ollama-qdrant
          - cloud
          - local
          - all-providers
        description: Backend chain provider SDK bundle installed at Docker build time.
      classifier_provider:
        type: choice
        default: anthropic
        options: [anthropic, openai, groq, together, ollama, google]
        description: CLASSIFIER_PROVIDER for the backend runtime.
      classifier_model:
        type: string
        default: claude-haiku-4-5-20251001
        description: CLASSIFIER_MODEL for the backend runtime.
      reasoning_provider:
        type: choice
        default: anthropic
        options: [anthropic, openai, groq, together, ollama, google]
        description: REASONING_PROVIDER for the backend runtime.
      reasoning_model:
        type: string
        default: claude-sonnet-4-6
        description: REASONING_MODEL for the backend runtime.
      embedding_provider:
        type: choice
        default: openai
        options: [openai, ollama, sentence-transformers, huggingface, google]
        description: EMBEDDING_PROVIDER for query-time embeddings.
      embedding_model:
        type: string
        default: text-embedding-3-large
        description: EMBEDDING_MODEL shared with RAG ingestion.
      embedding_dimension:
        type: string
        default: "3072"
        description: EMBEDDING_DIMENSION shared with RAG ingestion.
      vector_store:
        type: choice
        default: qdrant
        options: [qdrant, chromadb, pinecone, pgvector]
        description: VECTOR_STORE for the backend runtime.
      vector_collection_prefix:
        type: string
        default: movies
        description: VECTOR_COLLECTION_PREFIX shared with RAG ingestion.
      ollama_base_url:
        type: string
        default: http://localhost:11434
        description: OLLAMA_BASE_URL when an Ollama provider is selected.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE:  movie-finder-backend
  FRONTEND_IMAGE: movie-finder-frontend
  WITH_PROVIDERS: ${{ inputs.with_providers || 'default-cloud' }}

jobs:

  # -------------------------------------------------------------------------- #
  resolve-tag:
    name: Resolve Tag
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.tag.outputs.build_tag }}
    steps:
      - name: Resolve build tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${GITHUB_SHA::8}"
          fi
          echo "build_tag=${TAG}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------- #
  build:
    name: Build Images
    needs: resolve-tag
    runs-on: ubuntu-latest
    env:
      BUILD_TAG: ${{ needs.resolve-tag.outputs.build_tag }}
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Docker login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
            docker login "${{ secrets.ACR_LOGIN_SERVER }}" \
              -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push backend image
        run: |
          FULL="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${BUILD_TAG}"
          docker pull "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:latest" || true
          docker build \
            --cache-from "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:latest" \
            --build-arg "WITH_PROVIDERS=${WITH_PROVIDERS}" \
            -t "${FULL}" \
            backend/
          docker push "${FULL}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            LATEST="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:latest"
            docker tag "${FULL}" "${LATEST}"
            docker push "${LATEST}"
          fi

      - name: Build and push frontend image
        run: |
          FULL="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${BUILD_TAG}"
          docker pull "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:latest" || true
          docker build \
            --cache-from "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:latest" \
            -t "${FULL}" \
            frontend/
          docker push "${FULL}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            LATEST="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:latest"
            docker tag "${FULL}" "${LATEST}"
            docker push "${LATEST}"
          fi

      - name: Docker logout
        if: always()
        run: docker logout "${{ secrets.ACR_LOGIN_SERVER }}" || true

  # -------------------------------------------------------------------------- #
  provision-staging:
    name: Provision Staging
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    environment: staging
    if: >
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_staging == 'true')
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_SP_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_SP_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_environment: staging
      TF_VAR_backend_image_tag: ${{ needs.resolve-tag.outputs.build_tag }}
      TF_VAR_frontend_image_tag: ${{ needs.resolve-tag.outputs.build_tag }}
      TF_VAR_acr_admin_enabled: "true"
      TF_VAR_db_admin_username: ${{ secrets.DB_ADMIN_USERNAME }}
      TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
      TF_VAR_app_secret_key: ${{ secrets.APP_SECRET_KEY }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
      TF_VAR_together_api_key: ${{ secrets.TOGETHER_API_KEY }}
      TF_VAR_google_api_key: ${{ secrets.GOOGLE_API_KEY }}
      TF_VAR_qdrant_url: ${{ secrets.QDRANT_URL }}
      TF_VAR_qdrant_api_key_ro: ${{ secrets.QDRANT_API_KEY_RO }}
      TF_VAR_qdrant_api_key_rw: ${{ secrets.QDRANT_API_KEY_RW }}
      TF_VAR_pinecone_api_key: ${{ secrets.PINECONE_API_KEY }}
      TF_VAR_pgvector_dsn: ${{ secrets.PGVECTOR_DSN }}
      TF_VAR_langsmith_api_key: ${{ secrets.LANGSMITH_API_KEY }}
      TF_VAR_classifier_provider: ${{ inputs.classifier_provider || vars.CLASSIFIER_PROVIDER || 'anthropic' }}
      TF_VAR_classifier_model: ${{ inputs.classifier_model || vars.CLASSIFIER_MODEL || 'claude-haiku-4-5-20251001' }}
      TF_VAR_reasoning_provider: ${{ inputs.reasoning_provider || vars.REASONING_PROVIDER || 'anthropic' }}
      TF_VAR_reasoning_model: ${{ inputs.reasoning_model || vars.REASONING_MODEL || 'claude-sonnet-4-6' }}
      TF_VAR_embedding_provider: ${{ inputs.embedding_provider || vars.EMBEDDING_PROVIDER || 'openai' }}
      TF_VAR_embedding_model: ${{ inputs.embedding_model || vars.EMBEDDING_MODEL || 'text-embedding-3-large' }}
      TF_VAR_embedding_dimension: ${{ inputs.embedding_dimension || vars.EMBEDDING_DIMENSION || '3072' }}
      TF_VAR_vector_store: ${{ inputs.vector_store || vars.VECTOR_STORE || 'qdrant' }}
      TF_VAR_vector_collection_prefix: ${{ inputs.vector_collection_prefix || vars.VECTOR_COLLECTION_PREFIX || 'movies' }}
      TF_VAR_ollama_base_url: ${{ inputs.ollama_base_url || vars.OLLAMA_BASE_URL || 'http://localhost:11434' }}
      TF_VAR_cors_origins: ${{ vars.CORS_ORIGINS || '[]' }}
      TF_VAR_global_rate_limit: ${{ vars.GLOBAL_RATE_LIMIT || '100/minute' }}
      TF_VAR_auth_rate_limit: ${{ vars.AUTH_RATE_LIMIT || '5/minute' }}
      TF_VAR_chat_rate_limit: ${{ vars.CHAT_RATE_LIMIT || '20/minute' }}
      TF_VAR_max_message_length: ${{ vars.MAX_MESSAGE_LENGTH || '2000' }}
      TF_VAR_langsmith_tracing: ${{ vars.LANGSMITH_TRACING || 'false' }}
      TF_VAR_langsmith_endpoint: ${{ vars.LANGSMITH_ENDPOINT || 'https://api.smith.langchain.com' }}
      TF_VAR_langsmith_project: ${{ vars.LANGSMITH_PROJECT || 'movie-finder' }}
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Terraform apply staging
        run: |
          cd infrastructure
          make init
          make apply

  # -------------------------------------------------------------------------- #
  deploy-staging:
    name: Deploy to Staging
    needs: [resolve-tag, build, provision-staging]
    runs-on: ubuntu-latest
    environment: staging
    if: >
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_staging == 'true')
    env:
      BUILD_TAG: ${{ needs.resolve-tag.outputs.build_tag }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_SP_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_SP_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Deploy backend to staging
        run: |
          az containerapp update \
            --name    movie-finder-backend-staging \
            --resource-group movie-finder-staging \
            --image   "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${BUILD_TAG}"

      - name: Deploy frontend to staging
        run: |
          az containerapp update \
            --name    movie-finder-frontend-staging \
            --resource-group movie-finder-staging \
            --image   "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${BUILD_TAG}"

      - name: Azure logout
        if: always()
        run: az logout || true

  # -------------------------------------------------------------------------- #
  provision-production:
    name: Provision Production
    needs: [resolve-tag, build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'true')
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_SP_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_SP_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_environment: production
      TF_VAR_backend_image_tag: ${{ needs.resolve-tag.outputs.build_tag }}
      TF_VAR_frontend_image_tag: ${{ needs.resolve-tag.outputs.build_tag }}
      TF_VAR_acr_admin_enabled: "true"
      TF_VAR_db_admin_username: ${{ secrets.DB_ADMIN_USERNAME }}
      TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
      TF_VAR_app_secret_key: ${{ secrets.APP_SECRET_KEY }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
      TF_VAR_together_api_key: ${{ secrets.TOGETHER_API_KEY }}
      TF_VAR_google_api_key: ${{ secrets.GOOGLE_API_KEY }}
      TF_VAR_qdrant_url: ${{ secrets.QDRANT_URL }}
      TF_VAR_qdrant_api_key_ro: ${{ secrets.QDRANT_API_KEY_RO }}
      TF_VAR_qdrant_api_key_rw: ${{ secrets.QDRANT_API_KEY_RW }}
      TF_VAR_pinecone_api_key: ${{ secrets.PINECONE_API_KEY }}
      TF_VAR_pgvector_dsn: ${{ secrets.PGVECTOR_DSN }}
      TF_VAR_langsmith_api_key: ${{ secrets.LANGSMITH_API_KEY }}
      TF_VAR_classifier_provider: ${{ inputs.classifier_provider || vars.CLASSIFIER_PROVIDER || 'anthropic' }}
      TF_VAR_classifier_model: ${{ inputs.classifier_model || vars.CLASSIFIER_MODEL || 'claude-haiku-4-5-20251001' }}
      TF_VAR_reasoning_provider: ${{ inputs.reasoning_provider || vars.REASONING_PROVIDER || 'anthropic' }}
      TF_VAR_reasoning_model: ${{ inputs.reasoning_model || vars.REASONING_MODEL || 'claude-sonnet-4-6' }}
      TF_VAR_embedding_provider: ${{ inputs.embedding_provider || vars.EMBEDDING_PROVIDER || 'openai' }}
      TF_VAR_embedding_model: ${{ inputs.embedding_model || vars.EMBEDDING_MODEL || 'text-embedding-3-large' }}
      TF_VAR_embedding_dimension: ${{ inputs.embedding_dimension || vars.EMBEDDING_DIMENSION || '3072' }}
      TF_VAR_vector_store: ${{ inputs.vector_store || vars.VECTOR_STORE || 'qdrant' }}
      TF_VAR_vector_collection_prefix: ${{ inputs.vector_collection_prefix || vars.VECTOR_COLLECTION_PREFIX || 'movies' }}
      TF_VAR_ollama_base_url: ${{ inputs.ollama_base_url || vars.OLLAMA_BASE_URL || 'http://localhost:11434' }}
      TF_VAR_cors_origins: ${{ vars.CORS_ORIGINS || '[]' }}
      TF_VAR_global_rate_limit: ${{ vars.GLOBAL_RATE_LIMIT || '100/minute' }}
      TF_VAR_auth_rate_limit: ${{ vars.AUTH_RATE_LIMIT || '5/minute' }}
      TF_VAR_chat_rate_limit: ${{ vars.CHAT_RATE_LIMIT || '20/minute' }}
      TF_VAR_max_message_length: ${{ vars.MAX_MESSAGE_LENGTH || '2000' }}
      TF_VAR_langsmith_tracing: ${{ vars.LANGSMITH_TRACING || 'false' }}
      TF_VAR_langsmith_endpoint: ${{ vars.LANGSMITH_ENDPOINT || 'https://api.smith.langchain.com' }}
      TF_VAR_langsmith_project: ${{ vars.LANGSMITH_PROJECT || 'movie-finder' }}
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Terraform apply production
        run: |
          cd infrastructure
          make init
          make apply

  # -------------------------------------------------------------------------- #
  deploy-production:
    name: Deploy to Production
    needs: [resolve-tag, provision-production]
    runs-on: ubuntu-latest
    environment: production        # requires manual approval (configure in GitHub Environments)
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'true')
    env:
      BUILD_TAG: ${{ needs.resolve-tag.outputs.build_tag }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_SP_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_SP_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Deploy backend to production
        run: |
          az containerapp update \
            --name    movie-finder-backend \
            --resource-group movie-finder-prod \
            --image   "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE }}:${BUILD_TAG}"

      - name: Deploy frontend to production
        run: |
          az containerapp update \
            --name    movie-finder-frontend \
            --resource-group movie-finder-prod \
            --image   "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE }}:${BUILD_TAG}"

      - name: Azure logout
        if: always()
        run: az logout || true
